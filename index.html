<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All the roads lead to:</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1 class="index-title">All the roads lead to:</h1>
  <nav class="sort-toggle" aria-label="Sort order">
    <button type="button" data-sort="count" class="active">by popularity</button>
    <button type="button" data-sort="order">by road</button>
  </nav>
  <ol id="roads" class="roads"></ol>
  <p id="empty" class="empty" hidden>No travelers yet. The first road has not been walked.</p>
</main>
<script>
fetch('counter.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : [])
  .then(rows => {
    const list = document.getElementById('roads');
    const empty = document.getElementById('empty');
    if (!Array.isArray(rows) || rows.length === 0) {
      empty.hidden = false;
      return;
    }

    const sorters = {
      count: (a, b) => (b.count - a.count) || ((a.order || 0) - (b.order || 0)) || a.name.localeCompare(b.name),
      order: (a, b) => ((a.order || 0) - (b.order || 0)) || a.name.localeCompare(b.name),
    };

    function render(mode) {
      list.innerHTML = '';
      rows.slice().sort(sorters[mode]).forEach(r => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.className = 'name';
        const a = document.createElement('a');
        a.href = 'articles/' + r.slug + '.html';
        a.textContent = r.name;
        name.appendChild(a);
        const meta = document.createElement('span');
        meta.className = 'count';
        meta.textContent = mode === 'order'
          ? '#' + (r.order ?? '?')
          : '× ' + r.count;
        li.appendChild(name);
        li.appendChild(meta);
        list.appendChild(li);
      });
    }

    const buttons = document.querySelectorAll('.sort-toggle button');
    buttons.forEach(b => {
      b.addEventListener('click', () => {
        buttons.forEach(x => x.classList.toggle('active', x === b));
        render(b.dataset.sort);
      });
    });

    render('count');
  })
  .catch(() => {
    document.getElementById('empty').hidden = false;
  });
</script>
</body>
</html>
